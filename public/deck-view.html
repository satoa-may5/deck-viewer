<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>画像出力 - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="export-page">
    <div class="export-topbar">
      <button type="button" class="btn" id="back-to-edit-btn">編集に戻る</button>
      <span id="deck-name-label" class="export-deck-name"></span>
    </div>

    <div class="export-preview-area">
      <canvas id="export-canvas"></canvas>
    </div>

    <div class="export-controls">
      <div class="export-align-group">
        <span class="export-align-label">最終行の並び</span>
        <button type="button" class="filter-pill" id="align-center-btn" aria-pressed="true">中央揃え</button>
        <button type="button" class="filter-pill" id="align-left-btn" aria-pressed="false">左詰め</button>
      </div>

      <label class="filter-checkbox">
        <input type="checkbox" id="show-name-checkbox" checked /> デッキ名を表示
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="show-card-name-checkbox" checked /> カード名を表示
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="show-mana-checkbox" checked /> マナカーブを表示
      </label>

      <button type="button" class="btn primary" id="download-btn">画像として保存</button>
      <button type="button" class="btn" id="print-btn">このデッキを印刷</button>
      <span id="print-status" class="status-message"></span>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/deck-view.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
