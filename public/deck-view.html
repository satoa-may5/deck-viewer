<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>画像出力 - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="export-page">
    <div class="export-topbar">
      <button type="button" class="btn" id="back-to-edit-btn">編集に戻る</button>
      <span id="deck-name-label" class="export-deck-name"></span>
    </div>

    <div class="export-preview-area">
      <canvas id="export-canvas"></canvas>
    </div>

    <div class="export-controls">
      <div class="export-align-group">
        <button type="button" class="filter-pill" id="align-center-btn" aria-pressed="true">中央揃え</button>
        <button type="button" class="filter-pill" id="align-left-btn" aria-pressed="false">左詰め</button>
      </div>

      <label class="filter-checkbox">
        <input type="checkbox" id="show-name-checkbox" checked /> デッキ名を表示
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="show-card-name-checkbox" checked /> カード名を表示
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="show-mana-checkbox" checked /> マナカーブを表示
      </label>

      <div class="export-action-group">
        <button type="button" class="btn primary" id="download-btn">画像として保存</button>
        <button type="button" class="btn" id="print-btn">このデッキを印刷</button>
        <button type="button" class="btn" id="open-calibration-btn">印刷サイズを調整</button>
        <span id="print-status" class="status-message"></span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="calibration-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>印刷サイズの調整</h2>
        <button type="button" class="icon-btn" id="calibration-close-btn">✕</button>
      </div>
      <div class="modal-body-vertical">
        <p class="crop-hint">
          プリンターや設定によって、実際に印刷される大きさは基準値からずれることがあります。
          「調整用シートをダウンロード」で横線・縦線(それぞれ100mm)の画像を入手し、印刷してから
          その長さを定規で実測して入力・保存すると、以降の印刷でカードが正確に63mm×88mmになる
          よう自動調整します。
        </p>
        <button type="button" class="btn" id="print-calibration-sheet-btn">調整用シートをダウンロード</button>
        <div class="field-row">
          <div class="field">
            <label for="cal-measured-w">実測した横線の長さ(mm) ※基準100mm</label>
            <input type="number" id="cal-measured-w" step="0.1" min="1" placeholder="100" />
          </div>
          <div class="field">
            <label for="cal-measured-h">実測した縦線の長さ(mm) ※基準100mm</label>
            <input type="number" id="cal-measured-h" step="0.1" min="1" placeholder="100" />
          </div>
        </div>
        <div class="nav-links">
          <button type="button" class="btn" id="calibration-reset-btn">補正をリセット</button>
          <button type="button" class="btn primary" id="calibration-save-btn">この数値で保存する</button>
        </div>
        <div id="calibration-status" class="status-message"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/card-info-jobs.js"></script>
  <script src="js/deck-view.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
