<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>デッキメーカー(仮)</h1>
    </div>

    <div class="tab-card">
      <div class="tab-header" id="tabs">
        <button type="button" class="tab-btn" data-tab="pools">カードプール</button>
        <button type="button" class="tab-btn" data-tab="decks">デッキ</button>
      </div>

      <div class="tab-body">
        <div class="tab-panel" id="panel-pools">
          <div class="list-toolbar">
            <button type="button" class="btn favorites-only-btn" id="pool-favorites-only-btn">★ お気に入りのみ表示</button>
            <button type="button" class="btn" id="import-pool-btn">カードプールをインポート</button>
            <button type="button" class="btn" id="export-pool-btn">カードプールをエクスポート</button>
            <div class="view-toggle" id="pool-view-toggle">
              <button type="button" class="view-toggle-btn" data-view="list" title="一覧表示">☰</button>
              <button type="button" class="view-toggle-btn" data-view="grid" title="グリッド表示">▦</button>
            </div>
          </div>
          <button type="button" class="ghost-row" id="create-pool-row">＋ カードプールを作る</button>
          <div class="deck-list" id="pool-list"></div>
        </div>

        <div class="tab-panel" id="panel-decks">
          <div class="list-toolbar">
            <button type="button" class="btn favorites-only-btn" id="deck-favorites-only-btn">★ お気に入りのみ表示</button>
            <button type="button" class="btn" id="import-deck-btn">デッキをインポート</button>
            <div class="view-toggle" id="deck-view-toggle">
              <button type="button" class="view-toggle-btn" data-view="list" title="一覧表示">☰</button>
              <button type="button" class="view-toggle-btn" data-view="grid" title="グリッド表示">▦</button>
            </div>
          </div>
          <button type="button" class="ghost-row" id="create-deck-row">＋ デッキを作る</button>
          <div class="deck-list" id="deck-list"></div>
        </div>
      </div>
    </div>

    <input type="file" id="import-deck-file-input" accept=".dvdeck" hidden />

    <div class="modal-overlay" id="import-pool-modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2>カードプールをインポート</h2>
          <button type="button" class="icon-btn" id="close-import-modal-btn">✕</button>
        </div>
        <button type="button" class="ghost-row" id="import-pool-local-row">＋ ローカルからカードプールをインポート</button>
        <div class="import-pool-search-row">
          <input type="text" id="import-pool-search-input" placeholder="カードプール名で検索" />
          <select id="import-pool-year-select" title="vol.1の発売日で検索">
            <option value="">年</option>
          </select>
        </div>
        <div id="import-pool-list"></div>
      </div>
    </div>

    <div class="modal-overlay" id="export-pool-modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2>カードプールをエクスポート</h2>
          <button type="button" class="icon-btn" id="close-export-modal-btn">✕</button>
        </div>
        <div id="export-pool-list"></div>
      </div>
    </div>

    <input type="file" id="import-pool-file-input" accept=".dvpool" hidden />
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/card-info-jobs.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/home.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
