<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>デッキメーカー</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>デッキメーカー</h1>
    </div>

    <div class="tab-card">
      <div class="tab-header" id="tabs">
        <button type="button" class="tab-btn" data-tab="pools">カードプール</button>
        <button type="button" class="tab-btn" data-tab="decks">デッキ</button>
      </div>

      <div class="tab-body">
        <div class="tab-panel" id="panel-pools">
          <button type="button" class="ghost-row" id="create-pool-row">＋ カードプールを作る</button>
          <div class="deck-list" id="pool-list"></div>
        </div>

        <div class="tab-panel" id="panel-decks">
          <a class="ghost-row" href="builder.html">＋ デッキを作る</a>
          <div class="deck-list" id="deck-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
