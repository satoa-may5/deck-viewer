<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カードプール - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="btn btn-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M4 17h11a4 4 0 0 0 0-8H8" />
          <path d="M11 6l-3 3 3 3" />
        </svg>
        一覧に戻る
      </a>
      <div class="view-toggle" id="view-toggle">
        <button type="button" class="view-toggle-btn" data-view="list" title="一覧表示">☰</button>
        <button type="button" class="view-toggle-btn" data-view="grid" title="グリッド表示">▦</button>
      </div>
    </div>

    <div class="pool-header">
      <span class="pool-header-label">CARD POOL</span>
      <input type="text" id="pool-name-input" class="pool-name-input" placeholder="カードプール名" />
      <span class="pool-card-count" id="pool-card-count"></span>
    </div>

    <div class="list-toolbar">
      <button type="button" class="btn" id="select-mode-btn">選択して削除</button>
    </div>

    <div class="selection-bar" id="selection-bar" hidden>
      <span id="selection-count"></span>
      <button type="button" class="btn danger" id="selection-delete-btn" disabled>削除する</button>
      <button type="button" class="btn" id="selection-cancel-btn">キャンセル</button>
    </div>

    <div class="content-with-filter">
      <div class="content-main">
        <div id="card-list"></div>
      </div>

      <aside class="filter-sidebar" id="filter-bar">
        <div class="filter-box">
          <div class="filter-box-title">タイプ</div>
          <div class="filter-box-body filter-vertical" id="filter-type-group"></div>
        </div>

        <div class="filter-box">
          <div class="filter-box-title">色</div>
          <div class="filter-box-body filter-horizontal" id="filter-color-group"></div>
        </div>

        <div class="filter-box">
          <div class="filter-box-title">必要エナジー</div>
          <div class="filter-box-body">
            <div class="range-slider-wrap">
              <div class="range-slider-track">
                <div class="range-slider-fill" id="filter-cost-fill"></div>
              </div>
              <input type="range" id="filter-cost-min" min="0" max="15" step="1" value="0" />
              <input type="range" id="filter-cost-max" min="0" max="15" step="1" value="15" />
            </div>
            <div class="range-slider-labels">
              <span id="filter-cost-min-label">0</span>
              <span id="filter-cost-max-label">15</span>
            </div>
          </div>
        </div>

        <div class="filter-box">
          <div class="filter-box-body">
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-parallel-checkbox" /> パラレルを除外
            </label>
          </div>
        </div>

        <button type="button" class="btn" id="filter-clear-btn">リセット</button>
      </aside>
    </div>

    <button type="button" class="fab" id="open-add-card-btn">＋</button>

    <div class="modal-overlay" id="add-card-modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title">カードを追加</h2>
          <button type="button" class="icon-btn" id="close-modal-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-image-area" id="modal-image-area"></div>
          <div class="modal-info-area">
            <div class="field">
              <label for="modal-card-name">カード名(任意)</label>
              <input type="text" id="modal-card-name" placeholder="" />
            </div>
            <div class="field">
              <label for="modal-card-type">タイプ(任意)</label>
              <select id="modal-card-type">
                <option value="">(未設定)</option>
                <option value="character">キャラクター</option>
                <option value="event">イベント</option>
                <option value="field">フィールド</option>
              </select>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="modal-card-cost">必要エナジー(任意)</label>
                <input type="number" id="modal-card-cost" min="0" step="1" />
              </div>
              <div class="field">
                <label for="modal-card-color">色(任意)</label>
                <input type="text" id="modal-card-color" placeholder="例: 青" />
              </div>
            </div>
            <div class="field checkbox-field">
              <label><input type="checkbox" id="modal-card-parallel" /> パラレル</label>
            </div>
            <button type="button" class="btn primary" id="modal-save-btn">保存する</button>
            <div id="modal-status" class="status-message"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay crop-popup-overlay" id="crop-popup" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2>トリミング</h2>
          <button type="button" class="icon-btn" id="crop-popup-close">✕</button>
        </div>
        <p class="crop-hint">ドラッグで移動、ホイール/ピンチで拡大縮小してトリミング範囲を調整してください</p>
        <div class="crop-stage" id="crop-popup-stage"></div>
        <div class="nav-links crop-popup-actions">
          <button type="button" class="btn" id="crop-popup-cancel">キャンセル</button>
          <button type="button" class="btn primary" id="crop-popup-ok">OK</button>
        </div>
      </div>
    </div>

    <input type="file" id="modal-file-input" accept="image/png,image/jpeg" capture="environment" hidden />
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/pool-detail.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
