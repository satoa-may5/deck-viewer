<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カードプール - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="btn btn-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M4 17h11a4 4 0 0 0 0-8H8" />
          <path d="M11 6l-3 3 3 3" />
        </svg>
        一覧に戻る
      </a>
      <div class="view-toggle" id="view-toggle">
        <button type="button" class="view-toggle-btn" data-view="list" title="一覧表示">☰</button>
        <button type="button" class="view-toggle-btn" data-view="grid" title="グリッド表示">▦</button>
      </div>
    </div>

    <div class="pool-header">
      <span class="pool-header-label">CARD POOL</span>
      <input type="text" id="pool-name-input" class="pool-name-input" placeholder="カードプール名" />
      <span class="pool-card-count" id="pool-card-count"></span>
    </div>

    <div class="list-toolbar">
      <button type="button" class="btn" id="select-mode-btn">選択して削除</button>
    </div>

    <div class="selection-bar" id="selection-bar" hidden>
      <span id="selection-count"></span>
      <button type="button" class="btn danger" id="selection-delete-btn" disabled>削除する</button>
      <button type="button" class="btn" id="selection-cancel-btn">キャンセル</button>
    </div>

    <div class="content-with-filter">
      <div class="content-main">
        <div id="card-list"></div>
      </div>

      <aside class="filter-sidebar" id="filter-bar">
        <div class="filter-frame" id="filter-frame">
        <div class="filter-accordion-scroll" id="filter-accordion-scroll">
          <details class="filter-accordion">
            <summary>カード名/効果で検索</summary>
            <div class="filter-accordion-body">
              <input type="text" id="filter-search-input" placeholder="キーワードを入力" />
            </div>
          </details>

          <details class="filter-accordion">
            <summary>カード種類</summary>
            <div class="filter-accordion-body filter-vertical" id="filter-type-group"></div>
          </details>

          <details class="filter-accordion">
            <summary>カードの色／必要エナジー</summary>
            <div class="filter-accordion-body">
              <div class="filter-horizontal" id="filter-color-group"></div>
              <div class="range-slider-wrap" style="margin-top: 10px">
                <div class="range-slider-track">
                  <div class="range-slider-fill" id="filter-cost-fill"></div>
                </div>
                <input type="range" id="filter-cost-min" min="0" max="15" step="1" value="0" />
                <input type="range" id="filter-cost-max" min="0" max="15" step="1" value="15" />
              </div>
              <div class="range-slider-labels">
                <span id="filter-cost-min-label">0</span>
                <span id="filter-cost-max-label">15</span>
              </div>
            </div>
          </details>

          <details class="filter-accordion">
            <summary>発生エナジー</summary>
            <div class="filter-accordion-body filter-pills-wrap" id="filter-generated-energy-group"></div>
          </details>

          <details class="filter-accordion">
            <summary>消費AP</summary>
            <div class="filter-accordion-body filter-pills-wrap" id="filter-ap-group"></div>
          </details>

          <details class="filter-accordion">
            <summary>BP</summary>
            <div class="filter-accordion-body">
              <div class="range-slider-wrap">
                <div class="range-slider-track">
                  <div class="range-slider-fill" id="filter-bp-fill"></div>
                </div>
                <input type="range" id="filter-bp-min" min="0" max="500" step="500" value="0" />
                <input type="range" id="filter-bp-max" min="0" max="500" step="500" value="500" />
              </div>
              <div class="range-slider-labels">
                <span id="filter-bp-min-label">0</span>
                <span id="filter-bp-max-label">500</span>
              </div>
            </div>
          </details>

          <details class="filter-accordion">
            <summary>トリガー効果</summary>
            <div class="filter-accordion-body filter-vertical" id="filter-trigger-group"></div>
          </details>

          <details class="filter-accordion" id="filter-attribute-accordion">
            <summary>特徴</summary>
            <div class="filter-accordion-body filter-block-list" id="filter-attribute-group"></div>
          </details>

          <details class="filter-accordion" id="filter-rarity-accordion">
            <summary>レアリティ</summary>
            <div class="filter-accordion-body filter-block-list" id="filter-rarity-group"></div>
          </details>

          <div class="filter-frame-controls">
            <label class="filter-checkbox-btn">
              <input type="checkbox" id="filter-parallel-checkbox" /> パラレルを除外
            </label>
            <label class="filter-checkbox-btn" id="filter-all-color-wrap" hidden>
              <input type="checkbox" id="filter-all-color-checkbox" /> プロモファイナルを除外
            </label>
            <button type="button" class="btn" id="filter-clear-btn">検索条件をリセット</button>
          </div>
        </div>
        </div>
        <button type="button" class="btn" id="thumbnail-mode-btn">サムネイルを設定</button>
      </aside>
    </div>

    <button type="button" class="fab" id="open-add-card-btn" title="カードを追加">
      <svg viewBox="0 0 34 24" width="30" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h6M6 9v6" stroke-width="2.2" />
        <rect x="13" y="7" width="10" height="14" rx="2" transform="rotate(-8 18 14)" />
        <rect x="18.5" y="4" width="10" height="14" rx="2" fill="var(--surface)" />
      </svg>
    </button>

    <div class="modal-overlay" id="add-card-modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title">カードを追加</h2>
          <button type="button" class="icon-btn" id="close-modal-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-image-area" id="modal-image-area"></div>
          <div class="modal-info-area">
            <div class="field">
              <label for="modal-card-cardname">カード名</label>
              <input type="text" id="modal-card-cardname" placeholder="" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="modal-card-name">カード番号</label>
                <input type="text" id="modal-card-name" placeholder="" maxlength="20" />
              </div>
              <div class="field">
                <label for="modal-card-rarity">レアリティ</label>
                <input type="text" id="modal-card-rarity" placeholder="例: SR" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="modal-card-type">タイプ</label>
                <select id="modal-card-type">
                  <option value="">(未設定)</option>
                  <option value="character">キャラクター</option>
                  <option value="event">イベント</option>
                  <option value="field">フィールド</option>
                </select>
              </div>
              <div class="field">
                <label for="modal-card-color">色</label>
                <input type="text" id="modal-card-color" placeholder="例: 青" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="modal-card-cost">必要エナジー</label>
                <input type="number" id="modal-card-cost" min="0" step="1" />
              </div>
              <div class="field">
                <label for="modal-card-ap">消費AP</label>
                <input type="number" id="modal-card-ap" min="0" step="1" />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="modal-card-bp">BP</label>
                <input type="text" id="modal-card-bp" placeholder="例: 2000+" />
              </div>
              <div class="field">
                <label for="modal-card-generated-energy">発生エナジー</label>
                <input type="text" id="modal-card-generated-energy" placeholder="例: 1+" />
              </div>
            </div>
            <div class="field">
              <label for="modal-card-attribute">特徴(カンマ区切りで複数可)</label>
              <input type="text" id="modal-card-attribute" placeholder="例: LiPPS, ポジティブパッション" />
            </div>
            <div class="field">
              <label for="modal-card-effect">効果</label>
              <textarea id="modal-card-effect" rows="4"></textarea>
            </div>
            <div class="field">
              <label for="modal-card-trigger">トリガー</label>
              <select id="modal-card-trigger">
                <option value="">(未設定/なし)</option>
                <option value="active">アクティブ</option>
                <option value="drow">ドロー</option>
                <option value="final">ファイナル</option>
                <option value="get">ゲット</option>
                <option value="raid">レイド</option>
                <option value="special">スペシャル</option>
                <option value="color">カラー</option>
              </select>
            </div>
            <div class="field checkbox-field">
              <label><input type="checkbox" id="modal-card-parallel" /> パラレル</label>
            </div>
            <div id="modal-status" class="status-message"></div>
          </div>
        </div>
        <div class="modal-actions" id="modal-actions-normal">
          <button type="button" class="btn primary" id="modal-save-btn">保存する</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay crop-popup-overlay" id="crop-popup" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2>トリミング</h2>
          <button type="button" class="icon-btn" id="crop-popup-close">✕</button>
        </div>
        <p class="crop-hint">ドラッグで移動、ホイール/ピンチで拡大縮小してトリミング範囲を調整してください</p>
        <div class="crop-stage" id="crop-popup-stage"></div>
        <div class="nav-links crop-popup-actions">
          <button type="button" class="btn" id="crop-popup-cancel">キャンセル</button>
          <button type="button" class="btn primary" id="crop-popup-ok">OK</button>
        </div>
      </div>
    </div>

    <input type="file" id="modal-file-input" accept="image/png,image/jpeg" capture="environment" hidden />

    <div class="modal-overlay" id="add-choice-modal" hidden>
      <div class="modal-card add-choice-card">
        <div class="modal-header">
          <h2>カードを追加</h2>
          <button type="button" class="icon-btn" id="close-add-choice-modal-btn">✕</button>
        </div>
        <div class="add-choice-actions">
          <button type="button" class="btn add-choice-btn" id="add-choice-oricard-btn">オリカを追加する</button>
          <button type="button" class="btn add-choice-btn" id="add-choice-single-btn">カードを1枚追加する</button>
          <button type="button" class="btn add-choice-btn" id="add-choice-bulk-btn">カードを複数枚追加する</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="oricard-modal" hidden>
      <div class="modal-card oricard-modal-card">
        <div class="modal-header">
          <h2>オリカを追加</h2>
          <button type="button" class="icon-btn" id="close-oricard-modal-btn">✕</button>
        </div>
        <div class="oricard-frame-wrap">
          <iframe id="oricard-frame" class="oricard-frame" title="オリカメーカー"></iframe>
          <div class="oricard-unavailable" id="oricard-unavailable" hidden>
            オリカメーカーが見つかりません(このマシン専用の機能です)。
          </div>
        </div>
        <div id="oricard-status" class="status-message"></div>
        <div class="modal-actions">
          <div class="oricard-save-load-group">
            <button type="button" class="btn" id="oricard-png-btn">PNG で保存</button>
            <button type="button" class="btn" id="oricard-json-save-btn">JSON保存</button>
            <button type="button" class="btn" id="oricard-json-load-btn">JSON読込</button>
            <input type="file" id="oricard-json-file" accept="application/json,.json" hidden>
          </div>
          <button type="button" class="btn primary" id="oricard-add-btn">このカードを追加する</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="bulk-add-modal" hidden>
      <div class="modal-card bulk-add-card">
        <div class="modal-header">
          <h2>カードを複数枚追加</h2>
          <button type="button" class="icon-btn" id="close-bulk-add-modal-btn">✕</button>
        </div>
        <div class="bulk-add-grid" id="bulk-add-grid"></div>
        <div id="bulk-add-status" class="status-message"></div>
        <div class="bulk-add-actions">
          <button type="button" class="icon-btn bulk-add-plus-btn" id="bulk-add-plus-btn" title="画像を追加する">＋</button>
          <button type="button" class="btn primary" id="bulk-add-done-btn">完了</button>
        </div>
      </div>
    </div>

    <input type="file" id="bulk-add-file-input" accept="image/png,image/jpeg" multiple hidden />

    <div class="modal-overlay lightbox-overlay" id="card-zoom-overlay" hidden>
      <button type="button" class="icon-btn lightbox-close" id="card-zoom-close">✕</button>
      <img id="card-zoom-img" src="" alt="" />
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/pool-detail.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
