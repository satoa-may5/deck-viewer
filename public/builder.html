<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>デッキ編集 - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="builder-page">
    <div class="builder-header">
      <div class="builder-header-actions">
        <button type="button" class="btn primary" id="save-back-btn">保存して戻る</button>
        <button type="button" class="btn" id="discard-back-btn">保存せずに戻る</button>
      </div>
      <input type="text" id="deck-name-input" placeholder="デッキ名" />
      <span id="save-status" class="status-message"></span>
    </div>

    <div class="pool-picker">
      <p class="pane-title">参照するカードプール(複数選択可)</p>
      <div class="pool-checkbox-list" id="pool-checkbox-list"></div>
    </div>

    <div class="builder-panes">
      <div class="pane pane-deck">
        <div class="pane-title-row">
          <p class="pane-title">デッキ</p>
          <button type="button" class="btn" id="deck-thumbnail-mode-btn">サムネイルを設定</button>
        </div>
        <div class="builder-grid" id="deck-grid"></div>
      </div>

      <div class="pane pane-collection">
        <p class="pane-title">カードプール</p>

        <div class="content-with-filter" id="collection-content">
          <div class="content-main">
            <div class="builder-grid" id="collection-grid"></div>
          </div>

          <aside class="filter-sidebar" id="filter-bar">
            <div class="filter-box">
              <div class="filter-box-title">タイプ</div>
              <div class="filter-box-body filter-vertical" id="filter-type-group"></div>
            </div>

            <div class="filter-box">
              <div class="filter-box-title">色</div>
              <div class="filter-box-body filter-horizontal" id="filter-color-group"></div>
            </div>

            <div class="filter-box">
              <div class="filter-box-title">必要エナジー</div>
              <div class="filter-box-body">
                <div class="range-slider-wrap">
                  <div class="range-slider-track">
                    <div class="range-slider-fill" id="filter-cost-fill"></div>
                  </div>
                  <input type="range" id="filter-cost-min" min="0" max="15" step="1" value="0" />
                  <input type="range" id="filter-cost-max" min="0" max="15" step="1" value="15" />
                </div>
                <div class="range-slider-labels">
                  <span id="filter-cost-min-label">0</span>
                  <span id="filter-cost-max-label">15</span>
                </div>
              </div>
            </div>

            <div class="filter-box">
              <div class="filter-box-body">
                <label class="filter-checkbox">
                  <input type="checkbox" id="filter-parallel-checkbox" /> パラレルを除外
                </label>
              </div>
            </div>

            <button type="button" class="btn" id="filter-clear-btn">リセット</button>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/card-render.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
