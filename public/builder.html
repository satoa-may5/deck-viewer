<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>デッキ編集 - デッキメーカー(仮)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="builder-page">
    <div class="builder-header">
      <div class="builder-header-actions">
        <button type="button" class="btn primary" id="save-back-btn">保存して戻る</button>
        <button type="button" class="btn" id="discard-back-btn">保存せずに戻る</button>
      </div>
      <input type="text" id="deck-name-input" placeholder="デッキ名" maxlength="20" />
      <span id="save-status" class="status-message"></span>
      <button type="button" class="btn" id="export-image-btn">画像を出力</button>
    </div>

    <div class="pool-picker">
      <div class="pane-title-row">
        <p class="pane-title">参照するカードプール(複数選択可)</p>
        <button type="button" class="btn favorites-only-btn" id="pool-picker-favorites-only-btn">★ お気に入りのみ表示</button>
      </div>
      <div class="pool-checkbox-list" id="pool-checkbox-list"></div>
    </div>

    <div class="builder-panes">
      <div class="pane pane-deck">
        <div class="pane-title-row">
          <p class="pane-title">デッキ <span id="deck-total-count" class="pane-title-count"></span></p>
          <div class="pane-title-actions">
            <button type="button" class="btn" id="deck-sort-cost-btn">必要エナジーで昇順ソート</button>
            <div class="deck-menu-wrap">
              <button type="button" class="icon-btn deck-menu-btn" id="deck-menu-btn" title="メニュー">
                <span class="deck-menu-lines-wrap">
                  <span class="deck-menu-lines"></span>
                  <span class="deck-menu-lines"></span>
                  <span class="deck-menu-lines"></span>
                </span>
              </button>
              <div class="deck-menu-dropdown" id="deck-menu-dropdown" hidden>
                <button type="button" class="deck-menu-item" id="deck-thumbnail-mode-btn">
                  <span class="deck-menu-item-label">サムネイルを設定</span>
                </button>
                <button type="button" class="deck-menu-item" id="deck-stats-btn">
                  <span class="deck-menu-item-label">統計情報を表示</span>
                </button>
                <button type="button" class="deck-menu-item" id="deck-export-zip-btn">
                  <span class="deck-menu-item-label">デッキをエクスポート</span>
                </button>
                <button type="button" class="deck-menu-item" id="deck-import-zip-btn">
                  <span class="deck-menu-item-label">デッキをインポート</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <input type="file" id="deck-import-zip-input" accept=".dvdeck" hidden />
        <div class="builder-grid" id="deck-grid"></div>
      </div>

      <div class="pane pane-collection">
        <p class="pane-title">カードプール</p>

        <div class="content-with-filter" id="collection-content">
          <div class="content-main">
            <div class="builder-grid" id="collection-grid"></div>
          </div>

          <aside class="filter-sidebar" id="filter-bar">
            <div class="filter-accordion-scroll" id="filter-accordion-scroll">
              <details class="filter-accordion">
                <summary>カード名/効果で検索</summary>
                <div class="filter-accordion-body">
                  <input type="text" id="filter-search-input" placeholder="キーワードを入力" />
                </div>
              </details>

              <details class="filter-accordion">
                <summary>カード種類</summary>
                <div class="filter-accordion-body filter-vertical" id="filter-type-group"></div>
              </details>

              <details class="filter-accordion">
                <summary>カードの色／必要エナジー</summary>
                <div class="filter-accordion-body">
                  <div class="filter-horizontal" id="filter-color-group"></div>
                  <div class="range-slider-wrap" style="margin-top: 10px">
                    <div class="range-slider-track">
                      <div class="range-slider-fill" id="filter-cost-fill"></div>
                    </div>
                    <input type="range" id="filter-cost-min" min="0" max="15" step="1" value="0" />
                    <input type="range" id="filter-cost-max" min="0" max="15" step="1" value="15" />
                  </div>
                  <div class="range-slider-labels">
                    <span id="filter-cost-min-label">0</span>
                    <span id="filter-cost-max-label">15</span>
                  </div>
                </div>
              </details>

              <details class="filter-accordion">
                <summary>発生エナジー</summary>
                <div class="filter-accordion-body filter-pills-wrap" id="filter-generated-energy-group"></div>
              </details>

              <details class="filter-accordion">
                <summary>消費AP</summary>
                <div class="filter-accordion-body filter-pills-wrap" id="filter-ap-group"></div>
              </details>

              <details class="filter-accordion">
                <summary>BP</summary>
                <div class="filter-accordion-body">
                  <div class="range-slider-wrap">
                    <div class="range-slider-track">
                      <div class="range-slider-fill" id="filter-bp-fill"></div>
                    </div>
                    <input type="range" id="filter-bp-min" min="0" max="500" step="500" value="0" />
                    <input type="range" id="filter-bp-max" min="0" max="500" step="500" value="500" />
                  </div>
                  <div class="range-slider-labels">
                    <span id="filter-bp-min-label">0</span>
                    <span id="filter-bp-max-label">500</span>
                  </div>
                </div>
              </details>

              <details class="filter-accordion">
                <summary>トリガー効果</summary>
                <div class="filter-accordion-body filter-vertical" id="filter-trigger-group"></div>
              </details>

              <details class="filter-accordion" id="filter-attribute-accordion">
                <summary>特徴</summary>
                <div class="filter-accordion-body filter-block-list" id="filter-attribute-group"></div>
              </details>

              <details class="filter-accordion" id="filter-rarity-accordion">
                <summary>レアリティ</summary>
                <div class="filter-accordion-body filter-block-list" id="filter-rarity-group"></div>
              </details>
            </div>

            <div class="filter-sidebar-footer">
              <label class="filter-checkbox">
                <input type="checkbox" id="filter-parallel-checkbox" /> パラレルを除外
              </label>
              <label class="filter-checkbox" id="filter-all-color-wrap" hidden>
                <input type="checkbox" id="filter-all-color-checkbox" /> プロモファイナルを除外
              </label>
              <button type="button" class="btn" id="filter-clear-btn">検索条件をリセット</button>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <div class="builder-bottom-bar">
      <button type="button" class="btn" id="undo-btn" title="元に戻す (Ctrl+Z)" disabled>↺ 元に戻す</button>
      <button type="button" class="btn" id="redo-btn" title="やり直す (Ctrl+Y)" disabled>↻ やり直す</button>
    </div>
  </div>

  <div class="modal-overlay" id="deck-stats-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>統計情報</h2>
        <button type="button" class="icon-btn" id="deck-stats-close-btn">✕</button>
      </div>
      <div class="modal-body-vertical">
        <p class="pane-title">必要エナジー</p>
        <div class="stats-mana-curve" id="stats-mana-curve"></div>
        <p class="pane-title">トリガー</p>
        <div class="stats-trigger-list" id="stats-trigger-list"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/card-info-jobs.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/card-render.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
