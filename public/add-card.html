<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カードを追加 - Deck Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>カードを追加</h1>
      <div class="nav-links">
        <a class="btn" href="index.html">← 一覧に戻る</a>
      </div>
    </div>

    <div class="form-card">
      <div id="step-select" class="field">
        <label for="file-input">カード画像を選択</label>
        <input type="file" id="file-input" accept="image/*" capture="environment" />
      </div>

      <div id="step-crop" hidden>
        <p class="crop-hint">ドラッグで移動、ホイール/ピンチで拡大縮小してトリミング範囲を調整してください(縦88:横63)</p>
        <div class="crop-stage" id="crop-stage"></div>
        <button type="button" class="btn primary" id="confirm-crop-btn">この範囲で決定</button>
        <button type="button" class="btn" id="retry-crop-btn">画像を選び直す</button>
      </div>

      <form id="meta-form" hidden>
        <div class="crop-stage" id="crop-preview" style="max-width:160px; margin-bottom:16px;"></div>
        <div class="field">
          <label for="card-id">カード番号(ID) *</label>
          <input type="text" id="card-id" placeholder="例: KMR-1-012" required pattern="[A-Za-z0-9._-]+" />
        </div>
        <div class="field">
          <label for="card-name">カード名 *</label>
          <input type="text" id="card-name" required />
        </div>
        <div class="field">
          <label for="card-cost">必要エナジー</label>
          <input type="number" id="card-cost" min="0" step="1" />
        </div>
        <button type="submit" class="btn primary">保存する</button>
        <div id="status" class="status-message"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/add-card.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
